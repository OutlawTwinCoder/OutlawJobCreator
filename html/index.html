<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Outlaw Job Creator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app" class="hidden">
      <header class="app-header">
        <div>
          <h1>Outlaw Job Creator</h1>
          <p class="subtitle">Gestion simple des jobs, points et coordonnées</p>
        </div>
        <div class="header-actions">
          <button id="refresh-btn" class="ghost">Actualiser</button>
          <button id="close-btn" class="danger">Fermer</button>
        </div>
      </header>

      <div class="layout">
        <aside class="jobs-panel">
          <div class="panel-header">
            <h2>Jobs</h2>
            <button id="new-job-btn" class="primary small">Nouveau job</button>
          </div>
          <div id="jobs-list" class="jobs-list"></div>
          <div class="esx-info" id="esx-info"></div>
        </aside>

        <main class="main-panel">
          <section class="card" id="job-form-card">
            <h2 id="job-form-title">Créer un job</h2>
            <form id="job-form" autocomplete="off">
              <div class="grid">
                <label>Nom job
                  <input type="text" name="job_name" required />
                </label>
                <label>Label
                  <input type="text" name="label" required />
                </label>
              </div>
              <div class="grid">
                <label>Tag
                  <input type="text" name="tag" />
                </label>
                <label>Couleur
                  <select name="color" id="job-color"></select>
                </label>
              </div>
              <div class="grid">
                <label>Icône
                  <select name="icon" id="job-icon"></select>
                </label>
                <label>Society
                  <input type="text" name="society_name" />
                </label>
              </div>
              <div class="grid">
                <label>Salaire par défaut
                  <input type="number" name="default_salary" min="0" step="1" />
                </label>
                <label>Whitelisted
                  <select name="whitelisted">
                    <option value="0">Non</option>
                    <option value="1">Oui</option>
                  </select>
                </label>
              </div>
              <div class="form-actions">
                <button type="submit" class="primary" id="job-save-btn">Enregistrer</button>
                <button type="button" class="danger" id="job-delete-btn">Supprimer</button>
              </div>
            </form>
            <div class="notice" id="job-permission"></div>
          </section>

          <section class="card" id="points-card">
            <div class="card-header">
              <h2>Points</h2>
              <button id="new-point-btn" class="primary small">Nouveau point</button>
            </div>
            <div id="points-list" class="points-list"></div>

            <form id="point-form" class="point-form" autocomplete="off">
              <h3 id="point-form-title">Ajouter un point</h3>
              <div class="grid">
                <label>Label
                  <input type="text" name="label" />
                </label>
                <label>Type
                  <select name="type" id="point-type"></select>
                </label>
              </div>
              <div class="grid">
                <label>Usage
                  <select name="usage_mode" id="point-usage"></select>
                </label>
                <label>Radius
                  <input type="number" name="radius" step="0.1" min="0" />
                </label>
              </div>
              <div class="coords-grid">
                <label>X
                  <input type="number" name="x" step="0.01" />
                </label>
                <label>Y
                  <input type="number" name="y" step="0.01" />
                </label>
                <label>Z
                  <input type="number" name="z" step="0.01" />
                </label>
                <label>Heading
                  <input type="number" name="heading" step="0.1" />
                </label>
                <button type="button" class="ghost" id="get-coords-btn">Get coords</button>
              </div>
              <div class="grid">
                <label>Item (optionnel)
                  <input type="text" name="item" />
                </label>
                <label>Récompense / quantité
                  <input type="text" name="reward" />
                </label>
              </div>
              <div class="form-actions">
                <button type="submit" class="primary" id="point-save-btn">Sauvegarder le point</button>
                <button type="button" class="danger" id="point-delete-btn">Supprimer le point</button>
              </div>
            </form>
          </section>
        </main>
      </div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
